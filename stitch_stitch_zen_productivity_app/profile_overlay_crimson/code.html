<style>
        body { background-color: theme('colors.background'); }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Modal Animation */
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes backdropFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-animate {
            animation: modalFadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .backdrop-animate {
            animation: backdropFadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Color Swatch Hover Effect */
        .color-swatch {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.active {
            box-shadow: inset 0 0 0 2px theme('colors.primary');
        }
    </style>
</head>
<body class="antialiased text-on-surface flex items-center justify-center min-h-screen">
<!-- Ambient Backdrop -->
<div class="fixed inset-0 bg-surface-variant/80 backdrop-blur-sm backdrop-animate z-40 flex items-center justify-center p-gutter">
<!-- Profile Overlay Modal -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_4px_20px_rgba(45,10,10,0.08)] w-full max-w-[480px] flex flex-col max-h-[921px] modal-animate z-50">
<!-- Header -->
<div class="flex items-center justify-between p-lg border-b border-outline-variant">
<h2 class="font-headline-md text-headline-md text-primary tracking-tight">Profile</h2>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-primary transition-colors duration-300">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto p-lg space-y-xl">
<!-- Avatar Section -->
<div class="flex flex-col items-center space-y-sm">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full border border-outline-variant bg-surface-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A minimalist profile avatar placeholder featuring a serene, abstract geometric composition in soft grays and stark black. The design evokes a sense of modern professional digital identity, perfectly aligned with the high-contrast, Japanese-inspired minimalist aesthetic of the Serene Logic application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQlccAYjOjECr2LCq1cMHF0qnBW50yKjrwwtmZRRuX2fwnLuG1arUCDqWfzrUSJ5IyyV2O6Hl47DrSkFZ5GUmWjd2XyfP8nzyD30oM74l5P9ZmiyTalADz86iZbzjzZcVjK3F8v3Y6RSWhV1QKIBGCugADTIthu7HZQuqRKgQkXOdj8qp9ISiyPvkdMXrW-U9IsAs2Xe9cOqTBWbmZqPdNvxlYX52pQn_N9c9466_G0TWk6FxK-jYxFA"/>
</div>
<div class="absolute inset-0 bg-primary/10 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-primary">photo_camera</span>
</div>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Update Photo</span>
</div>
<!-- Input Fields -->
<div class="space-y-lg">
<!-- Display Name -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="displayName">Display Name</label>
<input class="font-body-md text-body-md bg-transparent border-0 border-b border-outline-variant px-0 py-sm focus:ring-0 focus:border-primary transition-colors duration-300 text-primary placeholder-outline" id="displayName" type="text" value="Alex Serene"/>
</div>
<!-- Username -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="username">Username</label>
<input class="font-body-md text-body-md bg-transparent border-0 border-b border-outline-variant px-0 py-sm focus:ring-0 focus:border-primary transition-colors duration-300 text-primary placeholder-outline" id="username" type="text" value="@alex_s"/>
</div>
</div>
<!-- Profile Color Grid -->
<div class="space-y-sm pt-sm">
<label class="font-label-md text-label-md text-on-surface-variant block mb-md">Profile Color</label>
<div class="grid grid-cols-6 gap-sm" id="colorGrid">
<!-- Swatches will be generated by JS for brevity, but here are a few hardcoded examples to demonstrate the requested 24 grid layout structurally -->
<button aria-label="Color option 1" class="w-8 h-8 rounded-full bg-[#1A0505] color-swatch active focus:outline-none"></button>
<button aria-label="Color option 2" class="w-8 h-8 rounded-full bg-[#34100f] color-swatch focus:outline-none border border-outline-variant"></button>
<button aria-label="Color option 3" class="w-8 h-8 rounded-full bg-[#410004] color-swatch focus:outline-none"></button>
<button aria-label="Color option 4" class="w-8 h-8 rounded-full bg-[#852222] color-swatch focus:outline-none"></button>
<button aria-label="Color option 5" class="w-8 h-8 rounded-full bg-[#ae7572] color-swatch focus:outline-none"></button>
<button aria-label="Color option 6" class="w-8 h-8 rounded-full bg-[#f8eeee] color-swatch focus:outline-none border border-outline-variant"></button>
<!-- Simulating 24 items total (6x4 grid) -->
<script>
                            // Quick script to fill out the grid of 24 as requested without massive HTML bloat
                            const colors = ['#2C363F', '#4A5D23', '#8B4513', '#6A5ACD', '#4682B4', '#20B2AA', 
                                            '#D2691E', '#CD5C5C', '#556B2F', '#483D8B', '#008080', '#B8860B',
                                            '#800000', '#2E8B57', '#4B0082', '#000080', '#808000', '#A0522D'];
                            const grid = document.getElementById('colorGrid');
                            colors.forEach((color, i) => {
                                const btn = document.createElement('button');
                                btn.className = 'w-8 h-8 rounded-full color-swatch focus:outline-none';
                                btn.style.backgroundColor = color;
                                btn.setAttribute('aria-label', `Color option ${i+7}`);
                                grid.appendChild(btn);
                            });
                        </script>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="flex justify-end space-x-md p-lg border-t border-outline-variant bg-surface-container-lowest rounded-b-xl">
<button class="px-lg py-sm rounded-lg font-label-md text-label-md text-primary bg-transparent border border-outline-variant hover:bg-surface-container transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                    Cancel
                </button>
<button class="px-lg py-sm rounded-lg font-label-md text-label-md text-on-primary bg-primary hover:bg-surface-tint transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                    Save Changes
                </button>
</div>
</div>
</div>
<script>
        // Simple interactive logic for color swatches
        document.addEventListener('DOMContentLoaded', () => {
            const swatches = document.querySelectorAll('.color-swatch');
            swatches.forEach(swatch => {
                swatch.addEventListener('click', (e) => {
                    swatches.forEach(s => s.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });
        });
    </script>
</body></html>
