<style>
        /* Custom styles for WebKit range inputs to align with minimalist aesthetic */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #000000; /* Primary */
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 2px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        input[type=range]:hover::-webkit-slider-thumb {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: #d6c2c0; /* Outline Variant */
            border-radius: 2px;
        }
        
        /* Smooth fade-in for overlay */
        .overlay-enter {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .modal-enter {
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(4px); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen relative overflow-hidden font-body-md">
<!-- Background App Context (Simulated) -->
<div class="absolute inset-0 flex flex-col items-center justify-center opacity-30 pointer-events-none">
<h1 class="font-timer-display text-timer-display text-primary">25:00</h1>
<p class="font-body-lg text-body-lg text-secondary mt-md">Focus Session</p>

<div class="fixed inset-0 z-50 flex items-center justify-center bg-surface-dim/40 overlay-enter px-lg">

<!-- Header -->

<h2 class="font-headline-md text-headline-md text-primary tracking-tight">Soundscapes</h2>
</div>
<button aria-label="Close" class="text-secondary hover:text-primary transition-colors duration-300 w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container-low">

</button>

<!-- Current Mix Section -->
<section>
<div class="flex justify-between items-end mb-md">

<span class="font-label-md text-label-md text-secondary">2 Active</span>
</div>
<div class="space-y-sm bg-surface rounded-lg border border-outline-variant p-md">
<!-- Active Sound 1 -->
<div class="flex items-center gap-md group">
<span class="material-symbols-outlined text-primary shrink-0" data-icon="water_drop" style="font-size: 18px;">water_drop</span>
<span class="font-body-md text-body-md text-primary w-28 truncate font-medium">Heavy Rain</span>
<div class="flex-1 flex items-center h-4 group-hover:opacity-100 transition-opacity">

</div>
</div>

</div>
</div>
</section>

<!-- Card: Inactive -->

</section>

<div class="flex items-center gap-md">
